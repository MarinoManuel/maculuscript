# ─────────────────────────────────────────────────────────────────────────
#  MaculuScript — bloco nginx (dominio: maculuscript.sytes.net)
#
#  A app Java (porta 8080, apenas em 127.0.0.1) serve o FRONTEND e a API.
#  O nginx so' faz proxy reverso de tudo para essa porta.
#
#  Este bloco e' HTTP (porta 80). Depois de o por a funcionar, corra:
#       sudo certbot --nginx -d maculuscript.sytes.net
#  e o certbot adiciona automaticamente o bloco HTTPS (443) + redireccionamento.
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name maculuscript.sytes.net;

    # corpo de pedido ate' 2 MB (codigo colado pelo utilizador)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
